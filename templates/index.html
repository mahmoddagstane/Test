
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التداول متعددة الأزواج - RSI + EMA Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%);
            min-height: 100vh;
            padding: 10px;
            color: white;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #333;
        }
        
        .header {
            background: linear-gradient(45deg, #0066cc, #004499, #002266);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .header h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .status {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            opacity: 0.9;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
        }
        
        .pairs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            padding: 30px 20px;
        }
        
        @media (max-width: 768px) {
            .pairs-grid {
                grid-template-columns: 1fr;
                padding: 20px 15px;
                gap: 15px;
            }
        }
        
        .pair-card {
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid #0066cc;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .pair-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0066cc, #0088ff, #0066cc);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        
        .pair-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(0,102,204,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
            border-color: #0088ff;
        }
        
        .pair-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .pair-title {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .price-value {
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            font-weight: bold;
            color: #0088ff;
            background: rgba(0, 136, 255, 0.1);
            padding: 8px 15px;
            border-radius: 15px;
            border: 1px solid rgba(0, 136, 255, 0.3);
        }
        
        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 480px) {
            .indicators-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
        
        .indicator {
            background: rgba(255,255,255,0.05);
            padding: 20px 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .indicator:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        
        .indicator-label {
            font-size: 0.9rem;
            color: #cccccc;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .indicator-value {
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            font-weight: bold;
            color: #ffffff;
        }
        
        .rsi-value {
            color: #0088ff;
        }
        
        .ema-value {
            color: #ffffff;
        }
        
        .signal-box {
            background: rgba(0,0,0,0.3);
            padding: 20px 15px;
            border-radius: 15px;
            text-align: center;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .signal-text {
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            display: inline-block;
            font-size: clamp(0.9rem, 2vw, 1rem);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .rsi-gauge {
            position: relative;
            width: 120px;
            height: 60px;
            margin: 15px auto;
        }
        
        .gauge-bg {
            width: 120px;
            height: 60px;
            border: 4px solid #333333;
            border-bottom: none;
            border-radius: 60px 60px 0 0;
            position: relative;
        }
        
        .gauge-fill {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 120px;
            height: 60px;
            border: 4px solid #0066cc;
            border-bottom: none;
            border-radius: 60px 60px 0 0;
            transition: all 0.5s ease;
            filter: drop-shadow(0 0 8px rgba(0,102,204,0.5));
        }
        
        .gauge-pointer {
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 3px;
            height: 50px;
            background: linear-gradient(to top, #0066cc, #0088ff);
            transform-origin: bottom;
            transition: transform 0.5s ease;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0,136,255,0.5);
        }
        
        .balance-section {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, #0066cc, #0088ff, #004499);
            color: white;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 15px 35px rgba(0,102,204,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .balance-value {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .trades-section {
            grid-column: 1 / -1;
            margin-top: 30px;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #333333;
            margin-bottom: 20px;
            overflow-x: auto;
            gap: 5px;
        }
        
        .tab {
            padding: 15px 25px;
            background: #1a1a1a;
            border: 1px solid #333333;
            cursor: pointer;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            transition: all 0.3s ease;
            border-radius: 15px 15px 0 0;
            color: #cccccc;
            white-space: nowrap;
            min-width: 120px;
        }
        
        .tab:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
        
        .tab.active {
            background: linear-gradient(45deg, #0066cc, #0088ff);
            color: white;
            border-color: #0088ff;
            box-shadow: 0 5px 15px rgba(0,102,204,0.3);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .trade-item {
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #0066cc;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        @media (max-width: 768px) {
            .trade-item {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 10px;
                padding: 15px;
            }
        }
        
        .trade-item:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 25px rgba(0,102,204,0.2);
        }
        
        .trade-item.profit {
            border-left-color: #00aa00;
            background: linear-gradient(145deg, #1a2a1a, #1e2a1e);
        }
        
        .trade-item.loss {
            border-left-color: #cc0000;
            background: linear-gradient(145deg, #2a1a1a, #2a1e1e);
        }
        
        .trade-item.active {
            border-left-color: #0088ff;
            background: linear-gradient(145deg, #1a1a2a, #1e1e2a);
        }
        
        .trade-detail {
            text-align: center;
        }
        
        .trade-detail .label {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            color: #cccccc;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .trade-detail .value {
            font-size: clamp(0.9rem, 2vw, 1rem);
            font-weight: bold;
            color: #ffffff;
        }
        
        .close-btn {
            background: linear-gradient(45deg, #cc0000, #ff0000);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(204,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(204,0,0,0.4);
            background: linear-gradient(45deg, #ff0000, #cc0000);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 15px;
            }
        }
        
        .stat-card {
            background: linear-gradient(145deg, #2a2a2a, #1e1e1e);
            padding: 25px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,102,204,0.3);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,102,204,0.2);
            border-color: #0088ff;
        }
        
        .stat-card .stat-value {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        .stat-card .stat-label {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: #cccccc;
            font-weight: 500;
        }
        
        .profit-value { 
            color: #00cc00;
            text-shadow: 0 0 10px rgba(0,204,0,0.5);
        }
        
        .loss-value { 
            color: #cc0000;
            text-shadow: 0 0 10px rgba(204,0,0,0.5);
        }
        
        .timestamp {
            color: #cccccc;
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            margin-top: 20px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .updating {
            animation: pulse 2s infinite;
        }
        
        .ema-status {
            margin-top: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .ema-bull {
            background: linear-gradient(45deg, rgba(0,204,0,0.2), rgba(0,255,0,0.1));
            color: #00ff00;
            border-color: #00cc00;
        }
        
        .ema-bear {
            background: linear-gradient(45deg, rgba(204,0,0,0.2), rgba(255,0,0,0.1));
            color: #ff4444;
            border-color: #cc0000;
        }
        
        /* تحسينات إضافية للهواتف */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .container {
                border-radius: 15px;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .pair-card {
                padding: 20px 15px;
            }
            
            .balance-section {
                padding: 25px 20px;
            }
            
            .tabs {
                padding: 0 5px;
            }
            
            .tab {
                padding: 12px 18px;
                min-width: 100px;
            }
        }
        
        /* تأثيرات بصرية إضافية */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pair-card, .stat-card, .trade-item {
            animation: fadeIn 0.6s ease-out;
        }
        
        /* تحسين التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #0066cc, #0088ff);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #0088ff, #00aaff);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 لوحة التداول متعددة الأزواج</h1>
            <div class="status" id="status">جاري التحميل...</div>
        </div>
        
        <div class="pairs-grid">
            <!-- سيتم إنشاء كروت الأزواج ديناميكياً -->
            <div id="pairs-container"></div>
            
            <div class="balance-section">
                <h3>💰 إجمالي الرصيد</h3>
                <div class="balance-value" id="balance">--</div>
                <div>USDT (Testnet)</div>
            </div>
            
            <div class="trades-section">
                <div class="tabs">
                    <button class="tab active" onclick="showTab('stats')">📈 الإحصائيات</button>
                    <button class="tab" onclick="showTab('active')">🔥 الصفقات النشطة</button>
                    <button class="tab" onclick="showTab('completed')">✅ الصفقات المكتملة</button>
                </div>
                
                <div id="stats-tab" class="tab-content active">
                    <h3 style="color: #ffffff; margin-bottom: 20px;">📊 إحصائيات التداول الإجمالية</h3>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="total-trades">0</div>
                            <div class="stat-label">إجمالي الصفقات</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value profit-value" id="winning-trades">0</div>
                            <div class="stat-label">صفقات رابحة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value loss-value" id="losing-trades">0</div>
                            <div class="stat-label">صفقات خاسرة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="win-rate">0%</div>
                            <div class="stat-label">نسبة النجاح</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value profit-value" id="total-profit">$0</div>
                            <div class="stat-label">إجمالي الربح</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="avg-profit">$0</div>
                            <div class="stat-label">متوسط الربح</div>
                        </div>
                    </div>
                </div>
                
                <div id="active-tab" class="tab-content">
                    <h3 style="color: #ffffff; margin-bottom: 20px;">🔥 الصفقات النشطة</h3>
                    <div id="active-trades">
                        <p style="text-align: center; color: #cccccc; padding: 20px;">لا توجد صفقات نشطة</p>
                    </div>
                </div>
                
                <div id="completed-tab" class="tab-content">
                    <h3 style="color: #ffffff; margin-bottom: 20px;">✅ الصفقات المكتملة</h3>
                    <div id="completed-trades">
                        <p style="text-align: center; color: #cccccc; padding: 20px;">لا توجد صفقات مكتملة</p>
                    </div>
                </div>
            </div>
            
            <div class="timestamp" id="timestamp">--</div>
        </div>
    </div>

    <script>
        const symbols = {{ symbols|tojson }};
        
        function createPairCard(symbol) {
            return `
                <div class="pair-card" id="card-${symbol.replace('/', '-')}">
                    <div class="pair-header">
                        <div class="pair-title">${symbol}</div>
                        <div class="price-value" id="price-${symbol.replace('/', '-')}">--</div>
                    </div>
                    
                    <div class="indicators-grid">
                        <div class="indicator">
                            <div class="indicator-label">RSI (14)</div>
                            <div class="indicator-value rsi-value" id="rsi-${symbol.replace('/', '-')}">--</div>
                            <div class="rsi-gauge">
                                <div class="gauge-bg">
                                    <div class="gauge-fill" id="gauge-fill-${symbol.replace('/', '-')}"></div>
                                    <div class="gauge-pointer" id="gauge-pointer-${symbol.replace('/', '-')}"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="indicator">
                            <div class="indicator-label">EMA 20/50</div>
                            <div class="indicator-value ema-value" id="ema20-${symbol.replace('/', '-')}">--</div>
                            <div style="font-size: 0.9rem; margin-top: 5px; color: #cccccc;" id="ema50-${symbol.replace('/', '-')}">--</div>
                            <div class="ema-status" id="ema-status-${symbol.replace('/', '-')}">--</div>
                        </div>
                    </div>
                    
                    <div class="signal-box">
                        <div class="signal-text" id="signal-${symbol.replace('/', '-')}" style="background-color: #333333;">لا توجد إشارة</div>
                    </div>
                </div>
            `;
        }
        
        function initializePairs() {
            const container = document.getElementById('pairs-container');
            container.innerHTML = symbols.map(symbol => createPairCard(symbol)).join('');
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        function updateData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    // تحديث بيانات كل زوج
                    symbols.forEach(symbol => {
                        const pairData = data.pairs[symbol];
                        const cleanSymbol = symbol.replace('/', '-');
                        
                        if (pairData) {
                            document.getElementById(`price-${cleanSymbol}`).textContent = 
                                pairData.price.toLocaleString() + ' $';
                            document.getElementById(`rsi-${cleanSymbol}`).textContent = pairData.rsi;
                            document.getElementById(`ema20-${cleanSymbol}`).textContent = 
                                'EMA20: ' + pairData.ema20.toFixed(2);
                            document.getElementById(`ema50-${cleanSymbol}`).textContent = 
                                'EMA50: ' + pairData.ema50.toFixed(2);
                            
                            // تحديث إشارة EMA
                            const emaStatus = document.getElementById(`ema-status-${cleanSymbol}`);
                            if (pairData.ema20 > pairData.ema50) {
                                emaStatus.textContent = '📈 صاعد';
                                emaStatus.className = 'ema-status ema-bull';
                            } else {
                                emaStatus.textContent = '📉 هابط';
                                emaStatus.className = 'ema-status ema-bear';
                            }
                            
                            // تحديث الإشارة
                            const signalElement = document.getElementById(`signal-${cleanSymbol}`);
                            signalElement.textContent = pairData.signal;
                            
                            // تحديد لون الإشارة حسب النوع
                            let signalColor = '#333333';
                            if (pairData.signal.includes('شراء')) {
                                signalColor = 'linear-gradient(45deg, #00aa00, #00cc00)';
                            } else if (pairData.signal.includes('بيع')) {
                                signalColor = 'linear-gradient(45deg, #cc0000, #ff0000)';
                            } else if (pairData.signal.includes('صاعد')) {
                                signalColor = 'linear-gradient(45deg, #0066cc, #0088ff)';
                            } else if (pairData.signal.includes('هابط')) {
                                signalColor = 'linear-gradient(45deg, #ff6600, #ff8800)';
                            }
                            
                            signalElement.style.background = signalColor;
                            
                            // تحديث مؤشر RSI
                            updateRSIGauge(pairData.rsi, cleanSymbol);
                        }
                    });
                    
                    // تحديث الرصيد والحالة
                    document.getElementById('balance').textContent = data.balance.toLocaleString() + ' USDT';
                    document.getElementById('timestamp').textContent = 'آخر تحديث: ' + data.timestamp;
                    document.getElementById('status').textContent = data.status;
                    
                    // تحديث إحصائيات التداول
                    updateTradeStats(data.trades.stats);
                    
                    // تحديث الصفقات
                    updateTrades(data.trades);
                })
                .catch(error => {
                    console.error('خطأ في جلب البيانات:', error);
                    document.getElementById('status').textContent = 'خطأ في الاتصال';
                });
        }
        
        function updateRSIGauge(rsi, cleanSymbol) {
            const pointer = document.getElementById(`gauge-pointer-${cleanSymbol}`);
            const fill = document.getElementById(`gauge-fill-${cleanSymbol}`);
            
            if (pointer && fill) {
                const angle = (rsi / 100) * 180;
                pointer.style.transform = `translateX(-50%) rotate(${angle - 90}deg)`;
                
                let color = '#0066cc';
                if (rsi < 30) {
                    color = '#00cc00';
                } else if (rsi > 70) {
                    color = '#cc0000';
                }
                
                fill.style.borderColor = color;
                pointer.style.background = `linear-gradient(to top, ${color}, #ffffff)`;
            }
        }
        
        function updateTradeStats(stats) {
            document.getElementById('total-trades').textContent = stats.total_trades;
            document.getElementById('winning-trades').textContent = stats.winning_trades;
            document.getElementById('losing-trades').textContent = stats.losing_trades;
            document.getElementById('win-rate').textContent = stats.win_rate.toFixed(1) + '%';
            document.getElementById('total-profit').textContent = '$' + stats.total_profit.toFixed(2);
            document.getElementById('avg-profit').textContent = '$' + stats.avg_profit.toFixed(2);
        }
        
        function updateTrades(trades) {
            // تحديث الصفقات النشطة
            const activeContainer = document.getElementById('active-trades');
            if (trades.active.length === 0) {
                activeContainer.innerHTML = '<p style="text-align: center; color: #cccccc; padding: 20px;">لا توجد صفقات نشطة</p>';
            } else {
                activeContainer.innerHTML = trades.active.map(trade => createTradeHTML(trade, true)).join('');
            }
            
            // تحديث الصفقات المكتملة
            const completedContainer = document.getElementById('completed-trades');
            if (trades.completed.length === 0) {
                completedContainer.innerHTML = '<p style="text-align: center; color: #cccccc; padding: 20px;">لا توجد صفقات مكتملة</p>';
            } else {
                completedContainer.innerHTML = trades.completed.slice(-10).reverse().map(trade => createTradeHTML(trade, false)).join('');
            }
        }
        
        function createTradeHTML(trade, isActive) {
            const pnl = isActive ? trade.pnl : trade.final_pnl;
            const pnlClass = pnl > 0 ? 'profit' : (pnl < 0 ? 'loss' : 'active');
            const statusClass = isActive ? 'active' : pnlClass;
            
            return `
                <div class="trade-item ${statusClass}">
                    <div class="trade-detail">
                        <div class="label">رقم الصفقة</div>
                        <div class="value">#${trade.id}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">الزوج</div>
                        <div class="value">${trade.symbol}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">النوع</div>
                        <div class="value">${trade.side === 'buy' ? '🟢 شراء' : '🔴 بيع'}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">سعر الدخول</div>
                        <div class="value">$${trade.entry_price.toFixed(4)}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">الكمية</div>
                        <div class="value">${trade.quantity.toFixed(6)}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">الربح/الخسارة</div>
                        <div class="value ${pnl > 0 ? 'profit-value' : 'loss-value'}">$${pnl.toFixed(2)}</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">النسبة</div>
                        <div class="value ${pnl > 0 ? 'profit-value' : 'loss-value'}">${(isActive ? trade.pnl_percentage : trade.final_pnl_percentage).toFixed(2)}%</div>
                    </div>
                    <div class="trade-detail">
                        <div class="label">الوقت</div>
                        <div class="value">${trade.entry_time.split(' ')[1]}</div>
                    </div>
                    ${isActive ? `<div class="trade-detail"><button class="close-btn" onclick="closeTrade(${trade.id})">إغلاق</button></div>` : ''}
                </div>
            `;
        }
        
        function closeTrade(tradeId) {
            fetch(`/api/close_trade/${tradeId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateData();
                    }
                });
        }
        
        // تهيئة الصفحة
        initializePairs();
        
        // تحديث البيانات كل 5 ثواني
        updateData();
        setInterval(updateData, 5000);
    </script>
</body>
</html>
