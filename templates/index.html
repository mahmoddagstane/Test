
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت التداول - Binance RSI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .status {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .price-value {
            color: #2980b9;
        }
        
        .rsi-value {
            color: #e74c3c;
        }
        
        .balance-value {
            color: #27ae60;
        }
        
        .signal-card {
            text-align: center;
            padding: 30px;
        }
        
        .signal-value {
            font-size: 1.5rem;
            padding: 15px 30px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        
        .rsi-gauge {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 20px auto;
        }
        
        .gauge-bg {
            width: 200px;
            height: 100px;
            border: 8px solid #ecf0f1;
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            position: relative;
        }
        
        .gauge-fill {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 200px;
            height: 100px;
            border: 8px solid;
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            transition: all 0.5s ease;
        }
        
        .gauge-pointer {
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 4px;
            height: 80px;
            background: #2c3e50;
            transform-origin: bottom;
            transition: transform 0.5s ease;
        }
        
        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .chart-container {
            grid-column: 1 / -1;
            height: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .timestamp {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .updating {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 بوت التداول RSI</h1>
            <div class="status" id="status">جاري التحميل...</div>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>💰 سعر BTC/USDT</h3>
                <div class="value price-value" id="price">--</div>
                <div class="timestamp" id="timestamp">--</div>
            </div>
            
            <div class="card">
                <h3>📊 مؤشر RSI</h3>
                <div class="value rsi-value" id="rsi">--</div>
                <div class="rsi-gauge">
                    <div class="gauge-bg">
                        <div class="gauge-fill" id="gauge-fill"></div>
                        <div class="gauge-pointer" id="gauge-pointer"></div>
                    </div>
                    <div class="gauge-labels">
                        <span>0</span>
                        <span>30</span>
                        <span>70</span>
                        <span>100</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3>💵 الرصيد USDT</h3>
                <div class="value balance-value" id="balance">--</div>
            </div>
            
            <div class="card signal-card">
                <h3>🚦 إشارة التداول</h3>
                <div class="signal-value" id="signal" style="background-color: gray;">لا توجد إشارة</div>
            </div>
        </div>
    </div>

    <script>
        function updateData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    // تحديث القيم
                    document.getElementById('price').textContent = data.price.toLocaleString() + ' $';
                    document.getElementById('rsi').textContent = data.rsi;
                    document.getElementById('balance').textContent = data.balance.toLocaleString() + ' USDT';
                    document.getElementById('timestamp').textContent = 'آخر تحديث: ' + data.timestamp;
                    document.getElementById('status').textContent = data.status;
                    
                    // تحديث الإشارة
                    const signalElement = document.getElementById('signal');
                    signalElement.textContent = data.signal;
                    signalElement.style.backgroundColor = data.signal_color || 'gray';
                    
                    // تحديث مؤشر RSI
                    updateRSIGauge(data.rsi);
                    
                    // إضافة تأثير التحديث
                    document.querySelector('.container').classList.add('updating');
                    setTimeout(() => {
                        document.querySelector('.container').classList.remove('updating');
                    }, 1000);
                })
                .catch(error => {
                    console.error('خطأ في جلب البيانات:', error);
                    document.getElementById('status').textContent = 'خطأ في الاتصال';
                });
        }
        
        function updateRSIGauge(rsi) {
            const pointer = document.getElementById('gauge-pointer');
            const fill = document.getElementById('gauge-fill');
            
            // تحويل RSI إلى زاوية (0-180 درجة)
            const angle = (rsi / 100) * 180;
            pointer.style.transform = `translateX(-50%) rotate(${angle - 90}deg)`;
            
            // تحديد لون المؤشر
            let color = '#3498db'; // أزرق افتراضي
            if (rsi < 30) {
                color = '#27ae60'; // أخضر للشراء
            } else if (rsi > 70) {
                color = '#e74c3c'; // أحمر للبيع
            }
            
            fill.style.borderColor = color;
        }
        
        // تحديث البيانات كل 5 ثواني
        updateData();
        setInterval(updateData, 5000);
    </script>
</body>
</html>
